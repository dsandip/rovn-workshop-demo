name: Issue → PromptQL bridge

# When a new issue is opened, POST it to a PromptQL room webhook so a bot
# spins up to handle it (implement → tests → PR → human approval → merge → deploy).
on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  notify-promptql:
    runs-on: ubuntu-latest
    steps:
      - name: Send issue to PromptQL
        env:
          WEBHOOK_PAT: ${{ secrets.PROMPTQL_WEBHOOK_PAT }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          WEBHOOK_URL="https://sandip-test.axiom-hasura.private-ddn.hasura.app/promptql-v2/hooks/room/36ffdf7e-674c-4fc3-a18c-1046375a6719/send_message"

          # Build the prompt telling the bot exactly what to do with this issue.
          # printf keeps every line inside the YAML block scalar (no heredoc).
          PROMPT=$(printf '%s\n' \
            "New GitHub issue opened in ${REPO} — please handle it end-to-end following the Rovn shipping loop:" \
            "1. Read the issue below." \
            "2. Create a branch and implement the change." \
            "3. Add/run tests." \
            "4. Open a pull request referencing the issue, then wait for a human to review, approve, and merge." \
            "Do NOT merge on your own — a human approves and merges, which triggers the Pages deploy." \
            "" \
            "--- ISSUE ---" \
            "Repo:   ${REPO}" \
            "Issue:  #${ISSUE_NUMBER} — ${ISSUE_TITLE}" \
            "Author: ${ISSUE_AUTHOR}" \
            "Link:   ${ISSUE_URL}" \
            "" \
            "${ISSUE_BODY}")

          # Raw issue payload as a JSON body artifact the bot can read if it wants.
          jq -n \
            --arg title "$ISSUE_TITLE" \
            --arg body "$ISSUE_BODY" \
            --arg number "$ISSUE_NUMBER" \
            --arg url "$ISSUE_URL" \
            --arg author "$ISSUE_AUTHOR" \
            --arg repo "$REPO" \
            '{repo:$repo, issue_number:($number|tonumber), title:$title, body:$body, url:$url, author:$author}' \
            > payload.json

          # URL-encode the prompt for the query string.
          ENCODED_PROMPT="$(jq -rn --arg p "$PROMPT" '$p|@uri')"

          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "${WEBHOOK_URL}?prompt=${ENCODED_PROMPT}" \
            -H "Authorization: pat ${WEBHOOK_PAT}" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json)

          echo "HTTP ${HTTP_CODE}"
          cat response.json
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PromptQL webhook returned HTTP ${HTTP_CODE}"
            exit 1
          fi