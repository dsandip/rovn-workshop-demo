name: Issue → PromptQL bridge

# When a new issue is opened, POST it to a PromptQL room webhook so a bot
# spins up. The bot only REGISTERS the issue and hands it to a human — the
# coding step (branch → tests → PR) is triggered by the Rovn user themselves
# so it runs under THEIR GitHub credentials (PR authored by them).
on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  notify-promptql:
    runs-on: ubuntu-latest
    steps:
      - name: Send issue to PromptQL
        env:
          WEBHOOK_PAT: ${{ secrets.PROMPTQL_WEBHOOK_PAT }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          WEBHOOK_URL="https://p-80843914-3fdd.rovn-rovn.private-ddn.hasura.app/promptql-v2/hooks/room/c98f0d64-6899-4204-9cfc-0193262b1898/send_message"

          # The bridge only REGISTERS the issue and hands it off to a human.
          # The coding step must be triggered by the Rovn user themselves so the
          # bot runs under THEIR GitHub credentials and the PR is authored by them.
          # printf keeps every line inside the YAML block scalar (no heredoc).
          PROMPT=$(printf '%s\n' \
            "A new GitHub issue was opened in ${REPO}. Do NOT start coding yet." \
            "" \
            "Right now, do ONLY this:" \
            "1. Set your title to \"${ISSUE_AUTHOR} - new issue: ${ISSUE_TITLE}\" (use the issuer's first name if you can resolve it, otherwise their GitHub login)." \
            "2. Post a short summary of the issue with its link." \
            "3. Ask the Rovn user who owns this issue to tag you in this thread to begin. Explain that the coding step (branch, implement, tests, open PR) will run under THEIR identity so the PR is opened with their own GitHub account, and that they must connect their GitHub to PromptQL first if they have not already." \
            "4. State clearly that you will NOT branch, implement, or open a PR until a human tags you — then end your turn and wait." \
            "" \
            "ONLY when a human later tags you to proceed: run the full Rovn shipping loop under that human's identity — create a branch, implement the change, add/run tests, open a pull request referencing the issue, then wait for a human to review, approve, and merge. Never merge on your own; a human approves and merges, which triggers the Pages deploy." \
            "" \
            "--- ISSUE ---" \
            "Repo:   ${REPO}" \
            "Issue:  #${ISSUE_NUMBER} - ${ISSUE_TITLE}" \
            "Author: ${ISSUE_AUTHOR}" \
            "Link:   ${ISSUE_URL}" \
            "" \
            "${ISSUE_BODY}")

          # Raw issue payload as a JSON body artifact the bot can read if it wants.
          jq -n \
            --arg title "$ISSUE_TITLE" \
            --arg body "$ISSUE_BODY" \
            --arg number "$ISSUE_NUMBER" \
            --arg url "$ISSUE_URL" \
            --arg author "$ISSUE_AUTHOR" \
            --arg repo "$REPO" \
            '{repo:$repo, issue_number:($number|tonumber), title:$title, body:$body, url:$url, author:$author}' \
            > payload.json

          # URL-encode the prompt for the query string.
          ENCODED_PROMPT="$(jq -rn --arg p "$PROMPT" '$p|@uri')"

          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "${WEBHOOK_URL}?prompt=${ENCODED_PROMPT}" \
            -H "Authorization: pat ${WEBHOOK_PAT}" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json)

          echo "HTTP ${HTTP_CODE}"
          cat response.json
          echo
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PromptQL webhook returned HTTP ${HTTP_CODE}"
            exit 1
          fi
