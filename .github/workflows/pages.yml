name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build metadata
        run: |
          SHA="${{ github.sha }}"
          TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > build.js <<EOF
          window.__BUILD__ = { sha: "${SHA}", time: "${TIME}" };
          EOF
          # load build.js before app.js
          sed -i 's#<script src="app.js"></script>#<script src="build.js"></script>\n  <script src="app.js"></script>#' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4